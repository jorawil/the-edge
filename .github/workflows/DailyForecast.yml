name: Daily Pregame Forecast Archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/DailyForecast.yml"
      - "scripts/generate_pregame_forecasts.py"
      - "scripts/backfill_espn.py"
      - "scripts/grade_forecast_archive.py"
      - "betting_model/forecast_archive.py"
      - "betting_model/features.py"
      - "betting_model/projection_engine.py"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to forecast"
        required: true
        default: "7"
        type: string

permissions:
  contents: write

concurrency:
  group: historical-data-backfill
  cancel-in-progress: false

jobs:
  daily-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out model code
        uses: actions/checkout@v4

      - name: Check out durable historical data
        uses: actions/checkout@v4
        with:
          ref: historical-data
          path: historical-data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests
          pip install -e . --no-deps

      - name: Refresh completed NBA and NFL box scores
        env:
          EDGE_DATA_DIR: ${{ github.workspace }}/historical-data/data
        run: |
          START_DATE="$(date -u -d 'yesterday' +%F)"
          END_DATE="$(date -u +%F)"
          python scripts/backfill_espn.py nba --start "$START_DATE" --end "$END_DATE"
          python scripts/backfill_espn.py nfl --start "$START_DATE" --end "$END_DATE"

      - name: Grade forecasts from completed ESPN boxes
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p historical-data/forecasts historical-data/reports
          python scripts/grade_forecast_archive.py \
            --archive historical-data/forecasts/forecast_archive.sqlite \
            --data-root historical-data/data \
            --out "historical-data/reports/forecast_grading_${RUN_ID}.json"

      - name: Generate upcoming pregame forecasts
        env:
          RUN_ID: ${{ github.run_id }}
          DAYS_AHEAD: ${{ inputs.days || '7' }}
        run: |
          python scripts/generate_pregame_forecasts.py \
            --sport both \
            --days "$DAYS_AHEAD" \
            --data-root historical-data/data \
            --archive historical-data/forecasts/forecast_archive.sqlite \
            --out "historical-data/reports/pregame_forecasts_${RUN_ID}.json"

      - name: Save data, forecast archive, and reports
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          cd historical-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No historical data, forecast archive, or report changes."
          else
            git commit -m "Refresh daily pregame forecasts (${RUN_ID})"
            git push origin HEAD:historical-data
          fi

      - name: Upload daily forecast reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-daily-forecasts-${{ github.run_id }}
          path: historical-data/reports/*_${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 90
