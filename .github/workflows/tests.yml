
name: Run tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

            - name: Run tests
        run: |
          mv __init__.py __init__.py.disabled
          trap 'mv __init__.py.disabled __init__.py' EXIT
          pytest -q
